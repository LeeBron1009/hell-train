<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>地獄列車</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;font-family:sans-serif}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:10px;box-sizing:border-box;pointer-events:none}
.grp{display:flex;gap:8px;pointer-events:auto}
button{width:70px;height:70px;border-radius:16px;border:0;font-size:28px;color:#fff;opacity:.8}
.r button{background:#d35400}.f button{background:#8e44ad}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:rgba(20,0,0,.85);text-align:center;padding:20px}
#msg h1{color:#ff3b30;font-size:42px;text-shadow:0 0 12px #f00}
#msg button{width:auto;height:auto;padding:14px 30px;font-size:22px;background:#c0392b;margin-top:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="grp r"><button id="rl">◀</button><button id="rr">▶</button></div>
  <div class="grp f"><button id="fl">◀</button><button id="fr">▶</button></div>
</div>
<div id="msg"><h1>🔥 地獄列車 🔥</h1>
<p>橘色按鈕控制【車尾】<br>紫色按鈕控制【車頭】<br>(電腦：A/D 車尾，←/→ 車頭)<br>也可以在螢幕左半滑動控制車尾、右半控制車頭<br>輾過被綁在鐵軌上的人得分，頭上的 ×數字是分數倍率<br>撞到障礙就會脫軌！</p>
<p id="best"></p><button id="start">開始遊戲</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,laneX=[],dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const tw=Math.min(W,480),x0=(W-tw)/2;laneX=[x0+tw*.2,x0+tw*.5,x0+tw*.8];}
addEventListener('resize',resize);resize();

const TYPES=[
 {m:1,w:50,ring:'#bdc3c7'},
 {m:2,w:30,ring:'#2ecc71'},
 {m:3,w:14,ring:'#3498db'},
 {m:5,w:6,ring:'#f1c40f'}];
const SKIN=['#ffdbac','#f1c27d','#e0ac69','#c68642','#8d5524'];
const HAIR=['#222','#5a3825','#d4a017','#c0392b','#8e44ad','#bdc3c7','#16a085'];
const SHIRT=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#ecf0f1','#fd79a8'];

let st='menu',score=0,best=+localStorage.getItem('best')||0,speed,dist,items,nextRow,combo,pops,parts,shake,kills;
let rear,front,sw=null,last=performance.now();
const GAP=Math.min(190,innerHeight*.26);
function wy(){return {f:H*.5,r:H*.5+GAP};}
function rnd(a){return a[Math.random()*a.length|0]}
function pickType(){let t=Math.random()*100;for(const ty of TYPES){if((t-=ty.w)<0)return ty;}return TYPES[0];}
function mkPerson(lane,y){
  return {k:'p',lane,y,ty:pickType(),skin:rnd(SKIN),hair:rnd(HAIR),shirt:rnd(SHIRT),
   hat:Math.random()<.3,glasses:Math.random()<.3,long:Math.random()<.4,seed:Math.random()*6};
}
function reset(){
  score=0;speed=260;dist=0;items=[];nextRow=-100;combo=0;pops=[];parts=[];shake=0;kills=0;
  rear={l:1,x:laneX[1]};front={l:1,x:laneX[1]};
}
function spawnRow(){
  const y=nextRow;let obs=[];
  if(Math.random()<.55){const n=Math.random()<.25?2:1;while(obs.length<n){const l=Math.random()*3|0;if(!obs.includes(l))obs.push(l);}}
  for(let l=0;l<3;l++){
    if(obs.includes(l))items.push({k:'o',lane:l,y,t:Math.random()<.5?0:1});
    else if(Math.random()<.5)items.push(mkPerson(l,y));
  }
  nextRow-=Math.max(150,260-speed*.12)+Math.random()*60;
}
function move(b,d){b.l=Math.max(0,Math.min(2,b.l+d));}
const acts={rl:()=>move(rear,-1),rr:()=>move(rear,1),fl:()=>move(front,-1),fr:()=>move(front,1)};
for(const id in acts){const e=document.getElementById(id);
  e.addEventListener('touchstart',ev=>{ev.preventDefault();acts[id]();},{passive:false});
  e.addEventListener('mousedown',acts[id]);}
addEventListener('keydown',e=>{
  if(e.key=='a')acts.rl();if(e.key=='d')acts.rr();
  if(e.key=='ArrowLeft')acts.fl();if(e.key=='ArrowRight')acts.fr();});
cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sw={x:t.clientX,side:t.clientX<W/2?'r':'f'};},{passive:true});
cv.addEventListener('touchend',e=>{if(!sw)return;const dx=e.changedTouches[0].clientX-sw.x;
  if(Math.abs(dx)>30)move(sw.side=='r'?rear:front,dx>0?1:-1);sw=null;},{passive:true});
document.getElementById('start').onclick=()=>{reset();st='play';document.getElementById('msg').style.display='none';last=performance.now();};

function popup(x,y,txt,c){pops.push({x,y,txt,c,t:0});}
function burst(x,y,col){
  for(let i=0;i<14;i++)parts.push({x,y,vx:(Math.random()-.5)*300,vy:-Math.random()*250,t:0,c:i%2?'#ff3b30':col,s:3+Math.random()*3});
  parts.push({x,y,vx:0,vy:-90,t:0,skull:true});
}
function update(dt){
  speed=Math.min(620,speed+dt*6);dist+=speed*dt;
  for(const b of [rear,front])b.x+=(laneX[b.l]-b.x)*Math.min(1,dt*18);
  for(const it of items)it.y+=speed*dt;
  nextRow+=speed*dt;
  while(nextRow>-60)spawnRow();
  const Y=wy();
  for(const it of items){
    if(it.dead)continue;
    for(const [b,y] of [[front,Y.f],[rear,Y.r]]){
      if(it.lane==b.l&&Math.abs(it.y-y)<26){
        if(it.k=='o'){gameOver();return;}
        it.dead=true;combo=Math.min(combo+1,10);kills++;shake=.12;
        const pts=Math.round(it.ty.m*10*(1+Math.floor(combo/3)*.5));
        score+=pts;popup(laneX[it.lane],y-30,'+'+pts+' ×'+it.ty.m,it.ty.ring);
        burst(laneX[it.lane],y,it.shirt);
      }
    }
    if(!it.dead&&it.k=='p'&&it.y>Y.r+60){it.dead=true;combo=0;popup(laneX[it.lane],Y.r+40,'逃過一劫','#aaa');}
  }
  items=items.filter(i=>!i.dead&&i.y<H+80);
  for(const p of pops){p.t+=dt;p.y-=40*dt;}pops=pops.filter(p=>p.t<1);
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.skull)p.vy+=700*dt;}
  parts=parts.filter(p=>p.t<(p.skull?1:.8));
}
function gameOver(){
  st='over';shake=.5;
  if(score>best){best=score;localStorage.setItem('best',best);}
  const m=document.getElementById('msg');m.style.display='flex';
  m.querySelector('h1').textContent='💥 列車脫軌！';
  m.querySelector('p').innerHTML='得分：'+score+'<br>輾過：'+kills+' 人';
  document.getElementById('best').textContent='最高分：'+best;
  document.getElementById('start').textContent='再來一次';
}
function drawPerson(p,x,y){
  const bob=Math.sin(performance.now()/120+p.seed)*2;
  ctx.save();ctx.translate(x,y+bob);
  ctx.strokeStyle=p.ty.ring;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-6,26,0,7);ctx.stroke();
  ctx.fillStyle=p.shirt;ctx.fillRect(-10,0,20,20);
  ctx.strokeStyle='#8b5a2b';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(-11,6);ctx.lineTo(11,6);ctx.moveTo(-11,14);ctx.lineTo(11,14);ctx.stroke();
  if(p.long){ctx.fillStyle=p.hair;ctx.fillRect(-11,-20,22,28);}
  ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(0,-10,11,0,7);ctx.fill();
  ctx.fillStyle=p.hair;ctx.beginPath();ctx.arc(0,-13,11,Math.PI,0);ctx.fill();
  if(p.hat){ctx.fillStyle=p.shirt;ctx.fillRect(-13,-22,26,5);ctx.fillRect(-8,-30,16,9);}
  ctx.fillStyle='#000';ctx.fillRect(-5,-11,2,3);ctx.fillRect(3,-11,2,3);
  if(p.glasses){ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(-7,-13,6,6);ctx.strokeRect(1,-13,6,6);}
  ctx.beginPath();ctx.arc(0,-3,3,Math.PI,0);ctx.stroke();
  ctx.textAlign='center';ctx.font='bold 12px sans-serif';ctx.fillStyle=p.ty.ring;ctx.fillText('×'+p.ty.m,0,-36);
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*12,(Math.random()-.5)*12);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0000');g.addColorStop(1,'#5a0a00');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2b0f0f';ctx.fillRect(laneX[0]-50,0,laneX[2]-laneX[0]+100,H);
  const off=dist%40;
  for(const x of laneX){
    ctx.fillStyle='#999';ctx.fillRect(x-14,0,3,H);ctx.fillRect(x+11,0,3,H);
    ctx.fillStyle='#4a2a1a';
    for(let y=-40+off;y<H;y+=40)ctx.fillRect(x-20,y,40,8);
  }
  ctx.fillStyle='rgba(255,90,0,.35)';
  for(let i=0;i<8;i++){const fy=(dist*.3+i*H/8)%H;ctx.beginPath();ctx.arc(laneX[0]-40+Math.sin(fy/30+i)*8,fy,4,0,7);ctx.arc(laneX[2]+40+Math.sin(fy/20+i)*8,H-fy,4,0,7);ctx.fill();}
  for(const it of items){
    const x=laneX[it.lane];
    if(it.k=='o'){
      ctx.fillStyle=it.t?'#555':'#7f8c8d';ctx.fillRect(x-24,it.y-18,48,36);
      ctx.fillStyle=it.t?'#ff3b30':'#f1c40f';
      for(let i=-24;i<24;i+=16){ctx.beginPath();ctx.moveTo(x+i,it.y+18);ctx.lineTo(x+i+8,it.y-18);ctx.lineTo(x+i+16,it.y-18);ctx.lineTo(x+i+8,it.y+18);ctx.fill();}
    }else drawPerson(it,x,it.y);
  }
  const Y=wy();
  ctx.lineCap='round';
  ctx.strokeStyle='#222';ctx.lineWidth=34;ctx.beginPath();ctx.moveTo(front.x,Y.f);ctx.lineTo(rear.x,Y.r);ctx.stroke();
  ctx.strokeStyle='#ff3b30';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(front.x,Y.f);ctx.lineTo(rear.x,Y.r);ctx.stroke();
  ctx.fillStyle='#8e44ad';ctx.fillRect(front.x-20,Y.f-14,40,14);
  ctx.fillStyle='#ff9f1a';ctx.beginPath();ctx.arc(front.x,Y.f-14,6,0,7);ctx.fill();
  ctx.fillStyle='#d35400';ctx.fillRect(rear.x-20,Y.r,40,12);
  ctx.fillStyle='#000';
  for(const [b,y] of [[front,Y.f],[rear,Y.r]]){ctx.fillRect(b.x-20,y-10,8,20);ctx.fillRect(b.x+12,y-10,8,20);}
  for(const p of parts){
    if(p.skull){ctx.globalAlpha=1-p.t;ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('💀',p.x,p.y);}
    else{ctx.globalAlpha=1-p.t/.8;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);}
  }
  ctx.globalAlpha=1;
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';
  ctx.fillText('得分 '+score,14,34);
  ctx.font='14px sans-serif';ctx.fillText('最高 '+best+'　輾過 '+kills,14,54);
  if(combo>1){ctx.fillStyle='#f1c40f';ctx.font='bold 18px sans-serif';ctx.fillText('連擊 '+combo,14,78);}
  ctx.textAlign='center';ctx.font='bold 16px sans-serif';
  for(const p of pops){ctx.globalAlpha=1-p.t;ctx.fillStyle=p.c;ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;ctx.restore();
}
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  if(st=='play')update(dt);
  if(shake>0)shake-=dt;
  draw();requestAnimationFrame(loop);
}
reset();document.getElementById('best').textContent='最高分：'+best;
requestAnimationFrame(loop);
</script>
</body>
</html>
