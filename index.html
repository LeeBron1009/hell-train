<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>地獄列車 3D</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;font-family:sans-serif}
canvas{display:block}
#hud{position:fixed;left:14px;top:10px;color:#fff;font-weight:bold;text-shadow:0 0 6px #000;pointer-events:none}
#flash{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:10px;box-sizing:border-box;pointer-events:none}
.grp{display:flex;gap:8px;pointer-events:auto}
button{width:70px;height:70px;border-radius:16px;border:0;font-size:28px;color:#fff;opacity:.8}
.r button{background:#d35400}.f button{background:#8e44ad}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:rgba(20,0,0,.85);text-align:center;padding:20px}
#msg h1{color:#ff3b30;font-size:42px;text-shadow:0 0 12px #f00}
#msg button{width:auto;height:auto;padding:14px 30px;font-size:22px;background:#c0392b;margin-top:16px}
</style>
</head>
<body>
<div id="hud"><div id="sc" style="font-size:22px">得分 0</div><div id="sub" style="font-size:14px"></div><div id="cb" style="color:#f1c40f;font-size:18px"></div></div>
<div id="flash"></div>
<div id="ui">
  <div class="grp r"><button id="rl">◀</button><button id="rr">▶</button></div>
  <div class="grp f"><button id="fl">◀</button><button id="fr">▶</button></div>
</div>
<div id="msg"><h1>🔥 地獄列車 3D 🔥</h1>
<p>橘色按鈕控制【車尾】<br>紫色按鈕控制【車頭】<br>(電腦：A/D 車尾，←/→ 車頭)<br>也可在螢幕左半滑動控制車尾、右半控制車頭<br>輾過被綁住的人得分，頭上 ×數字是倍率<br>撞到障礙就脫軌！</p>
<p id="best"></p><button id="start">開始遊戲</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a0000);
scene.fog=new THREE.Fog(0x2a0500,30,110);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);
camera.position.set(0,8,9);camera.lookAt(0,0,-9);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
scene.add(new THREE.AmbientLight(0xff9977,.7));
const dl=new THREE.DirectionalLight(0xffccaa,.8);dl.position.set(3,10,5);scene.add(dl);

const LX=[-3.2,0,3.2],ZF=-4,ZR=2;
const mat=(c)=>new THREE.MeshLambertMaterial({color:c});
const box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));

// 地面與鐵軌
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,300),mat(0x2b0f0f));
ground.rotation.x=-Math.PI/2;ground.position.set(0,-.02,-90);scene.add(ground);
const sleepers=[];
for(let l=0;l<3;l++){
  for(const dx of[-.7,.7]){const r=box(.12,.15,300,0x999999);r.position.set(LX[l]+dx,.08,-90);scene.add(r);}
  for(let i=0;i<50;i++){const s=box(2,.1,.4,0x4a2a1a);s.position.set(LX[l],.05,-i*3+10);scene.add(s);sleepers.push(s);}
}
// 火焰柱裝飾
const fires=[];
for(let i=0;i<14;i++){const f=new THREE.Mesh(new THREE.ConeGeometry(.6,2.5,6),new THREE.MeshBasicMaterial({color:i%2?0xff6600:0xff2200}));
  f.position.set((i%2?1:-1)*(7+Math.random()*3),1.2,-i*10);scene.add(f);fires.push(f);}

// 文字貼圖
function label(txt,color,size=1){
  const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');
  x.font='bold 80px sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=10;x.strokeStyle='#000';x.strokeText(txt,128,64);x.fillStyle=color;x.fillText(txt,128,64);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  sp.scale.set(3*size,1.5*size,1);return sp;
}

// 列車
const body=box(1.5,1.1,1,0xff3b30);scene.add(body);
const stripe=box(1.55,.25,1.02,0x111111);body.add(stripe);
function bogie(c){const g=new THREE.Group();
  const b=box(1.7,.9,1.8,c);b.position.y=.8;g.add(b);
  for(const sx of[-.9,.9])for(const sz of[-.55,.55]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.2,12),mat(0x000000));w.rotation.z=Math.PI/2;w.position.set(sx,.35,sz);g.add(w);}
  scene.add(g);return g;}
const bF=bogie(0x8e44ad),bR=bogie(0xd35400);
const lamp=new THREE.Mesh(new THREE.SphereGeometry(.25),new THREE.MeshBasicMaterial({color:0xffaa00}));lamp.position.set(0,.9,-.95);bF.add(lamp);

const TYPES=[{m:1,w:50,c:'#bdc3c7'},{m:2,w:30,c:'#2ecc71'},{m:3,w:14,c:'#3498db'},{m:5,w:6,c:'#f1c40f'}];
const SKIN=[0xffdbac,0xf1c27d,0xe0ac69,0xc68642,0x8d5524];
const HAIR=[0x222222,0x5a3825,0xd4a017,0xc0392b,0x8e44ad,0xbdc3c7,0x16a085];
const SHIRT=[0xe74c3c,0x3498db,0x2ecc71,0xf39c12,0x9b59b6,0x1abc9c,0xecf0f1,0xfd79a8];
const rnd=a=>a[Math.random()*a.length|0];
function pickType(){let t=Math.random()*100;for(const ty of TYPES){if((t-=ty.w)<0)return ty;}return TYPES[0];}

function makePerson(){
  const ty=pickType(),g=new THREE.Group();
  const sh=rnd(SHIRT),sk=rnd(SKIN),hr=rnd(HAIR);
  const torso=box(.7,.9,.4,sh);torso.position.y=.55;torso.rotation.x=-Math.PI/2;torso.position.y=.3;torso.position.z=.1;g.add(torso);
  // 躺在鐵軌上：身體沿 z 軸
  torso.rotation.x=0;torso.scale.set(1,.45,2.2);torso.position.set(0,.25,.4);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.38,12,12),mat(sk));head.position.set(0,.4,-.6);g.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.4,12,8,0,Math.PI*2,0,Math.PI/2),mat(hr));hair.position.set(0,.45,-.6);g.add(hair);
  if(Math.random()<.4){const lh=box(.7,.15,.7,hr);lh.position.set(0,.3,-.2);g.add(lh);}
  if(Math.random()<.3){const hat=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,.3,10),mat(rnd(SHIRT)));hat.position.set(0,.88,-.6);g.add(hat);}
  if(Math.random()<.3){const gl=box(.55,.1,.05,0x000000);gl.position.set(0,.5,-.95);g.add(gl);}
  for(const z of[.1,.7]){const rope=box(1.1,.12,.12,0x8b5a2b);rope.position.set(0,.5,z);g.add(rope);}
  for(const sx of[-.5,.5]){const arm=box(.2,.2,.8,sk);arm.position.set(sx*1.1,.2,.2);g.add(arm);}
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.3,.08,6,24),new THREE.MeshBasicMaterial({color:ty.c}));
  ring.rotation.x=Math.PI/2;ring.position.y=.1;g.add(ring);
  const lb=label('×'+ty.m,ty.c);lb.position.y=2.3;g.add(lb);
  g.userData={k:'p',ty};return g;
}
function makeObstacle(){
  const g=new THREE.Group(),t=Math.random()<.5;
  const b=box(2.2,1.6,1,t?0x555555:0x7f8c8d);b.position.y=.8;g.add(b);
  for(let i=-1;i<=1;i++){const s=box(.4,1.65,1.05,i%2?(t?0xff3b30:0xf1c40f):0x111111);s.position.set(i*.7,.8,0);s.rotation.z=.4;g.add(s);}
  g.userData={k:'o'};return g;
}

// 狀態
let st='menu',score=0,best=+localStorage.getItem('best')||0,speed,dist,items=[],nextZ,combo,kills,shake=0,flash=0;
let rear={l:1,x:0},front={l:1,x:0},parts=[],splats=[],pops=[],last=performance.now();
const $=id=>document.getElementById(id);
function clearAll(){for(const a of [items,parts,splats,pops])for(const o of a)scene.remove(o.m||o);items=[];parts=[];splats=[];pops=[];}
function reset(){clearAll();score=0;speed=22;dist=0;nextZ=-40;combo=0;kills=0;rear={l:1,x:0};front={l:1,x:0};}
function spawnRow(){
  let obs=[];
  if(Math.random()<.55){const n=Math.random()<.25?2:1;while(obs.length<n){const l=Math.random()*3|0;if(!obs.includes(l))obs.push(l);}}
  for(let l=0;l<3;l++){
    let m=null;
    if(obs.includes(l))m=makeObstacle();else if(Math.random()<.5)m=makePerson();
    if(m){m.position.set(LX[l],0,nextZ);m.userData.lane=l;scene.add(m);items.push(m);}
  }
  nextZ-=Math.max(11,20-speed*.2)+Math.random()*5;
}
function move(b,d){b.l=Math.max(0,Math.min(2,b.l+d));}
const acts={rl:()=>move(rear,-1),rr:()=>move(rear,1),fl:()=>move(front,-1),fr:()=>move(front,1)};
for(const id in acts){const e=$(id);
  e.addEventListener('touchstart',ev=>{ev.preventDefault();acts[id]();},{passive:false});
  e.addEventListener('mousedown',acts[id]);}
addEventListener('keydown',e=>{if(e.key=='a')acts.rl();if(e.key=='d')acts.rr();if(e.key=='ArrowLeft')acts.fl();if(e.key=='ArrowRight')acts.fr();});
let sw=null;
renderer.domElement.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sw={x:t.clientX,side:t.clientX<innerWidth/2?'r':'f'};},{passive:true});
renderer.domElement.addEventListener('touchend',e=>{if(!sw)return;const dx=e.changedTouches[0].clientX-sw.x;if(Math.abs(dx)>30)move(sw.side=='r'?rear:front,dx>0?1:-1);sw=null;},{passive:true});
$('start').onclick=()=>{reset();st='play';$('msg').style.display='none';last=performance.now();};

function burst(x,z,col){
  for(let i=0;i<30;i++){
    const m=box(.15,.15,.15,i%2?0xcc0000:col);m.position.set(x,.5,z);scene.add(m);
    parts.push({m,v:new THREE.Vector3((Math.random()-.5)*8,Math.random()*7,(Math.random()-.5)*8),t:0});
  }
  const sk=label('💀','#fff',.8);sk.position.set(x,2,z);scene.add(sk);parts.push({m:sk,v:new THREE.Vector3(0,3,0),t:0,s:true});
}
function pop(x,z,txt,c){const s=label(txt,c,1.2);s.position.set(x,3,z);scene.add(s);pops.push({m:s,t:0});}
function splat(x,z){
  for(let i=0;i<5;i++){
    const m=new THREE.Mesh(new THREE.CircleGeometry(.2+Math.random()*.5,10),new THREE.MeshBasicMaterial({color:0x8b0000}));
    m.rotation.x=-Math.PI/2;m.position.set(x+(Math.random()-.5)*1.6,.2,z+(Math.random()-.5)*2.5);scene.add(m);splats.push(m);
  }
}
function gameOver(){
  st='over';shake=.6;if(score>best){best=score;localStorage.setItem('best',best);}
  const m=$('msg');m.style.display='flex';
  m.querySelector('h1').textContent='💥 列車脫軌！';
  m.querySelector('p').innerHTML='得分：'+score+'<br>輾過：'+kills+' 人';
  $('best').textContent='最高分：'+best;$('start').textContent='再來一次';
}
function update(dt){
  speed=Math.min(50,speed+dt*.6);dist+=speed*dt;
  for(const b of[rear,front])b.x+=(LX[b.l]-b.x)*Math.min(1,dt*18);
  nextZ+=speed*dt;
  while(nextZ>-110)spawnRow();
  for(const it of items){
    it.position.z+=speed*dt;
    if(it.userData.dead)continue;
    for(const [b,z] of[[front,ZF],[rear,ZR]]){
      if(it.userData.lane==b.l&&Math.abs(it.position.z-z)<1.3){
        if(it.userData.k=='o'){gameOver();return;}
        it.userData.dead=true;scene.remove(it);combo=Math.min(combo+1,10);kills++;shake=.15;flash=.3;
        const pts=Math.round(it.userData.ty.m*10*(1+Math.floor(combo/3)*.5));score+=pts;
        pop(LX[it.userData.lane],z,'+'+pts,it.userData.ty.c);
        burst(LX[it.userData.lane],z,0xff3333);splat(LX[it.userData.lane],z);
      }
    }
    if(!it.userData.dead&&it.userData.k=='p'&&it.position.z>ZR+4){it.userData.dead=true;scene.remove(it);combo=0;}
  }
  items=items.filter(i=>!i.userData.dead&&i.position.z<ZR+10);
  for(const s of splats)s.position.z+=speed*dt;
  splats=splats.filter(s=>{if(s.position.z>15){scene.remove(s);return false}return true});
  for(const p of parts){p.t+=dt;p.m.position.addScaledVector(p.v,dt);if(!p.s)p.v.y-=20*dt;p.m.position.y=Math.max(.1,p.m.position.y);}
  parts=parts.filter(p=>{if(p.t>(p.s?1:.9)){scene.remove(p.m);return false}return true});
  for(const p of pops){p.t+=dt;p.m.position.y+=2*dt;p.m.position.z+=speed*dt*.3;p.m.material.opacity=1-p.t;}
  pops=pops.filter(p=>{if(p.t>1){scene.remove(p.m);return false}return true});
  $('sc').textContent='得分 '+score;$('sub').textContent='最高 '+best+'　輾過 '+kills;$('cb').textContent=combo>1?'連擊 '+combo:'';
}
function render(){
  bF.position.set(front.x,0,ZF);bR.position.set(rear.x,0,ZR);
  const a=new THREE.Vector3(front.x,.8,ZF),b=new THREE.Vector3(rear.x,.8,ZR);
  body.position.copy(a).add(b).multiplyScalar(.5);body.position.y=1.5;
  body.scale.z=a.distanceTo(b);body.lookAt(new THREE.Vector3(front.x,1.5,ZF));
  for(const s of sleepers){s.position.z=((s.position.z+10+dist*0)%150)-10;}
  const off=(dist%3);let i=0;
  for(const l of[0,1,2])for(let k=0;k<50;k++){sleepers[i++].position.z=-k*3+10+off;}
  fires.forEach((f,i)=>{f.position.z=((-i*10+dist)%140)-120;f.scale.y=1+Math.sin(performance.now()/100+i)*.2;});
  const sh=shake>0?(Math.random()-.5)*.5:0;
  camera.position.x=(front.x+rear.x)*.12+sh;camera.position.y=8+sh;
  camera.lookAt((front.x+rear.x)*.3,0,-9);
  $('flash').style.opacity=Math.max(0,flash);
  renderer.render(scene,camera);
}
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  if(st=='play')update(dt);
  if(shake>0)shake-=dt;if(flash>0)flash-=dt;
  render();requestAnimationFrame(loop);
}
reset();$('best').textContent='最高分：'+best;
requestAnimationFrame(loop);
</script>
</body>
</html>
