<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>地獄列車 3D</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;font-family:sans-serif}
canvas{display:block}
#hud{position:fixed;left:14px;top:10px;color:#fff;font-weight:bold;text-shadow:0 0 6px #000;pointer-events:none}
#stat{color:#7fdbff;font-size:15px}
#flash{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none}
#stage{position:fixed;left:0;right:0;top:30%;text-align:center;color:#ff3b30;font-size:34px;font-weight:bold;text-shadow:0 0 10px #000;opacity:0;pointer-events:none;transition:opacity .4s}
#pause{position:fixed;right:12px;top:10px;width:46px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px}
#ui{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;width:min(92vw,360px)}
.row{display:flex;gap:8px;align-items:center}
.row b{color:#fff;font-size:14px;width:44px;text-align:center;text-shadow:0 0 4px #000}
.row button{flex:1;height:58px;border-radius:14px;border:0;font-size:28px;color:#fff;opacity:.85}
.f button{background:#8e44ad}.r button{background:#d35400}
button:active{opacity:1;filter:brightness(1.3)}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:rgba(20,0,0,.88);text-align:center;padding:20px}
#msg h1{color:#ff3b30;font-size:42px;text-shadow:0 0 12px #f00}
#msg .big{padding:14px 30px;font-size:22px;background:#c0392b;margin-top:16px;border:0;border-radius:12px;color:#fff}
</style>
</head>
<body>
<div id="hud"><div id="sc" style="font-size:22px">得分 0</div><div id="sub" style="font-size:14px"></div><div id="cb" style="color:#f1c40f;font-size:18px"></div><div id="stat"></div></div>
<button id="pause">⏸</button>
<div id="stage"></div>
<div id="flash"></div>
<div id="ui">
  <div class="row f"><b>車頭</b><button id="fl">◀</button><button id="fr">▶</button></div>
  <div class="row r"><b>車尾</b><button id="rl">◀</button><button id="rr">▶</button></div>
</div>
<div id="msg"><h1>🔥 地獄列車 3D 🔥</h1>
<p>上排紫色＝【車頭】　下排橘色＝【車尾】<br>(電腦：←/→ 車頭，A/D 車尾，空白鍵暫停)<br>也可在螢幕左半滑動控制車尾、右半控制車頭<br>輾過被綁住的人得分，頭上 ×數字是倍率<br><br>🛡 護盾：擋一次障礙　✨ 雙倍分數　⏱ 慢動作<br>⚠ 迎面列車很長，要整段閃開！</p>
<p id="best"></p><button class="big" id="start">開始遊戲</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a0000);
scene.fog=new THREE.Fog(0x2a0500,30,110);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
function fit(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<.8?75:60;camera.updateProjectionMatrix();}
addEventListener('resize',fit);fit();
scene.add(new THREE.AmbientLight(0xff9977,.7));
const dl=new THREE.DirectionalLight(0xffccaa,.8);dl.position.set(3,10,5);scene.add(dl);

const LX=[-3.2,0,3.2],ZF=-4,ZR=2;
const mat=c=>new THREE.MeshLambertMaterial({color:c});
const box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));

const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,300),mat(0x2b0f0f));
ground.rotation.x=-Math.PI/2;ground.position.set(0,-.02,-90);scene.add(ground);
const sleepers=[];
for(let l=0;l<3;l++){
  for(const dx of[-.7,.7]){const r=box(.12,.15,300,0x999999);r.position.set(LX[l]+dx,.08,-90);scene.add(r);}
  for(let i=0;i<50;i++){const s=box(2,.1,.4,0x4a2a1a);scene.add(s);sleepers.push(s);}
}
const fires=[];
for(let i=0;i<14;i++){const f=new THREE.Mesh(new THREE.ConeGeometry(.6,2.5,6),new THREE.MeshBasicMaterial({color:i%2?0xff6600:0xff2200}));
  f.position.x=(i%2?1:-1)*(7+Math.random()*3);f.position.y=1.2;scene.add(f);fires.push(f);}

function label(txt,color,size=1){
  const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');
  x.font='bold 80px sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=10;x.strokeStyle='#000';x.strokeText(txt,128,64);x.fillStyle=color;x.fillText(txt,128,64);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  sp.scale.set(3*size,1.5*size,1);return sp;
}

// 音效
let AC=null;
function beep(f,d,type='square',vol=.12,slide=0){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
  g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

// 列車
const body=box(1.5,1.1,1,0xff3b30);scene.add(body);
body.add(Object.assign(box(1.55,.25,1.02,0x111111)));
function bogie(c){const g=new THREE.Group();
  const b=box(1.7,.9,1.8,c);b.position.y=.8;g.add(b);
  for(const sx of[-.9,.9])for(const sz of[-.55,.55]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.2,12),mat(0));w.rotation.z=Math.PI/2;w.position.set(sx,.35,sz);g.add(w);}
  scene.add(g);return g;}
const bF=bogie(0x8e44ad),bR=bogie(0xd35400);
const lamp=new THREE.Mesh(new THREE.SphereGeometry(.25),new THREE.MeshBasicMaterial({color:0xffaa00}));lamp.position.set(0,.9,-.95);bF.add(lamp);
const shieldMesh=new THREE.Mesh(new THREE.SphereGeometry(1.6,16,12),new THREE.MeshBasicMaterial({color:0x4aa3ff,transparent:true,opacity:.3}));
shieldMesh.visible=false;scene.add(shieldMesh);

const TYPES=[{m:1,w:50,c:'#bdc3c7'},{m:2,w:30,c:'#2ecc71'},{m:3,w:14,c:'#3498db'},{m:5,w:6,c:'#f1c40f'}];
const SKIN=[0xffdbac,0xf1c27d,0xe0ac69,0xc68642,0x8d5524];
const HAIR=[0x222222,0x5a3825,0xd4a017,0xc0392b,0x8e44ad,0xbdc3c7,0x16a085];
const SHIRT=[0xe74c3c,0x3498db,0x2ecc71,0xf39c12,0x9b59b6,0x1abc9c,0xecf0f1,0xfd79a8];
const rnd=a=>a[Math.random()*a.length|0];
function pickType(){let t=Math.random()*100;for(const ty of TYPES){if((t-=ty.w)<0)return ty;}return TYPES[0];}

function makePerson(){
  const ty=pickType(),g=new THREE.Group();
  const sh=rnd(SHIRT),sk=rnd(SKIN),hr=rnd(HAIR);
  const torso=box(.7,.4,1.6,sh);torso.position.set(0,.25,.4);g.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.38,12,12),mat(sk));head.position.set(0,.4,-.6);g.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.4,12,8,0,Math.PI*2,0,Math.PI/2),mat(hr));hair.position.set(0,.45,-.6);g.add(hair);
  if(Math.random()<.4){const lh=box(.7,.15,.7,hr);lh.position.set(0,.3,-.2);g.add(lh);}
  if(Math.random()<.3){const hat=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,.3,10),mat(rnd(SHIRT)));hat.position.set(0,.88,-.6);g.add(hat);}
  if(Math.random()<.3){const gl=box(.55,.1,.05,0);gl.position.set(0,.5,-.95);g.add(gl);}
  for(const z of[.1,.7]){const rope=box(1.1,.12,.12,0x8b5a2b);rope.position.set(0,.5,z);g.add(rope);}
  for(const sx of[-.55,.55]){const arm=box(.2,.2,.8,sk);arm.position.set(sx,.2,.2);g.add(arm);}
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.3,.08,6,24),new THREE.MeshBasicMaterial({color:ty.c}));
  ring.rotation.x=Math.PI/2;ring.position.y=.1;g.add(ring);
  const lb=label('×'+ty.m,ty.c);lb.position.y=2.3;g.add(lb);
  g.userData={k:'p',ty,half:1};return g;
}
function makeObstacle(){
  const g=new THREE.Group(),r=Math.random();
  if(r<.25){ // 迎面列車
    const b=box(2.2,2.2,14,0x7a1010);b.position.y=1.2;g.add(b);
    const f=box(2.3,1.2,.3,0xffee88);f.position.set(0,1.4,7.1);g.add(f);
    const w=box(2.25,.5,14.1,0x111111);w.position.y=1.5;g.add(w);
    g.userData={k:'o',half:7};
  }else{
    const t=r<.6;
    const b=box(2.2,1.6,1,t?0x555555:0x7f8c8d);b.position.y=.8;g.add(b);
    for(let i=-1;i<=1;i++){const s=box(.4,1.65,1.05,i%2?(t?0xff3b30:0xf1c40f):0x111111);s.position.set(i*.7,.8,0);s.rotation.z=.4;g.add(s);}
    g.userData={k:'o',half:.5};
  }
  return g;
}
const PU={shield:{i:'🛡',c:0x4aa3ff},x2:{i:'✨',c:0xffd700},slow:{i:'⏱',c:0x2ecc71}};
function makePower(){
  const kind=rnd(Object.keys(PU)),g=new THREE.Group();
  const orb=new THREE.Mesh(new THREE.SphereGeometry(.6,14,12),new THREE.MeshBasicMaterial({color:PU[kind].c,transparent:true,opacity:.8}));
  orb.position.y=1.3;g.add(orb);
  const lb=label(PU[kind].i,'#fff',.8);lb.position.y=1.3;g.add(lb);
  g.userData={k:'u',kind,half:.8};return g;
}

let st='menu',score=0,best=+localStorage.getItem('best')||0,speed,dist,items=[],nextZ,combo,kills,shake=0,flash=0,stage=1;
let shield=false,dbl=0,slow=0,paused=false;
let rear={l:1,x:0},front={l:1,x:0},parts=[],splats=[],pops=[],last=performance.now();
const $=id=>document.getElementById(id);
function clearAll(){for(const a of[items,parts,splats,pops])for(const o of a)scene.remove(o.m||o);items=[];parts=[];splats=[];pops=[];}
function reset(){clearAll();score=0;speed=22;dist=0;nextZ=-40;combo=0;kills=0;stage=1;shield=false;dbl=0;slow=0;paused=false;
  rear={l:1,x:0};front={l:1,x:0};scene.background.set(0x1a0000);scene.fog.color.set(0x2a0500);}
function spawnRow(){
  let obs=[];
  if(Math.random()<.55){const n=Math.random()<.25?2:1;while(obs.length<n){const l=Math.random()*3|0;if(!obs.includes(l))obs.push(l);}}
  for(let l=0;l<3;l++){
    let m=null;
    if(obs.includes(l))m=makeObstacle();
    else if(Math.random()<.07)m=makePower();
    else if(Math.random()<.5)m=makePerson();
    if(m){m.position.set(LX[l],0,nextZ);m.userData.lane=l;scene.add(m);items.push(m);}
  }
  nextZ-=Math.max(13,22-speed*.2)+Math.random()*5;
}
function move(b,d){if(st!='play'||paused)return;const o=b.l;b.l=Math.max(0,Math.min(2,b.l+d));if(o!=b.l)beep(300,.05,'sine',.05);}
const acts={rl:()=>move(rear,-1),rr:()=>move(rear,1),fl:()=>move(front,-1),fr:()=>move(front,1)};
for(const id in acts){const e=$(id);
  e.addEventListener('touchstart',ev=>{ev.preventDefault();acts[id]();},{passive:false});
  e.addEventListener('mousedown',acts[id]);}
function togglePause(){if(st!='play')return;paused=!paused;$('pause').textContent=paused?'▶':'⏸';last=performance.now();}
$('pause').addEventListener('click',togglePause);
addEventListener('keydown',e=>{if(e.key=='a')acts.rl();if(e.key=='d')acts.rr();if(e.key=='ArrowLeft')acts.fl();if(e.key=='ArrowRight')acts.fr();if(e.key==' ')togglePause();});
let sw=null;
renderer.domElement.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sw={x:t.clientX,side:t.clientX<innerWidth/2?'r':'f'};},{passive:true});
renderer.domElement.addEventListener('touchend',e=>{if(!sw)return;const dx=e.changedTouches[0].clientX-sw.x;if(Math.abs(dx)>30)move(sw.side=='r'?rear:front,dx>0?1:-1);sw=null;},{passive:true});
$('start').onclick=()=>{reset();st='play';$('msg').style.display='none';last=performance.now();beep(200,.2,'sawtooth',.1,300);};

function burst(x,z,col){
  for(let i=0;i<30;i++){
    const m=box(.15,.15,.15,i%2?0xcc0000:col);m.position.set(x,.5,z);scene.add(m);
    parts.push({m,v:new THREE.Vector3((Math.random()-.5)*8,Math.random()*7,(Math.random()-.5)*8),t:0});
  }
  const sk=label('💀','#fff',.8);sk.position.set(x,2,z);scene.add(sk);parts.push({m:sk,v:new THREE.Vector3(0,3,0),t:0,s:true});
}
function pop(x,z,txt,c){const s=label(txt,c,1.2);s.position.set(x,3,z);scene.add(s);pops.push({m:s,t:0});}
function splat(x,z){
  for(let i=0;i<5;i++){
    const m=new THREE.Mesh(new THREE.CircleGeometry(.2+Math.random()*.5,10),new THREE.MeshBasicMaterial({color:0x8b0000}));
    m.rotation.x=-Math.PI/2;m.position.set(x+(Math.random()-.5)*1.6,.2,z+(Math.random()-.5)*2.5);scene.add(m);splats.push(m);
  }
}
const STAGECOL=[[0x1a0000,0x2a0500],[0x100020,0x1a0030],[0x001a1a,0x002a2a],[0x201000,0x3a2000]];
function showStage(){
  const s=$('stage');s.textContent='第 '+stage+' 關';s.style.opacity=1;setTimeout(()=>s.style.opacity=0,1400);
  const c=STAGECOL[(stage-1)%STAGECOL.length];scene.background.set(c[0]);scene.fog.color.set(c[1]);beep(500,.3,'triangle',.1,400);
}
function gameOver(){
  st='over';shake=.6;beep(120,.6,'sawtooth',.2,-80);vib(300);
  if(score>best){best=score;localStorage.setItem('best',best);}
  const m=$('msg');m.style.display='flex';
  m.querySelector('h1').textContent='💥 列車脫軌！';
  m.querySelector('p').innerHTML='得分：'+score+'<br>輾過：'+kills+' 人　到達第 '+stage+' 關';
  $('best').textContent='最高分：'+best;$('start').textContent='再來一次';
}
function update(rdt){
  const dt=rdt*(slow>0?.6:1);
  speed=Math.min(55,speed+dt*.6);dist+=speed*dt;
  if(dbl>0)dbl-=rdt;if(slow>0)slow-=rdt;
  for(const b of[rear,front])b.x+=(LX[b.l]-b.x)*Math.min(1,rdt*18);
  nextZ+=speed*dt;
  while(nextZ>-110)spawnRow();
  for(const it of items){
    it.position.z+=speed*dt;
    const u=it.userData;if(u.dead)continue;
    for(const [b,z] of[[front,ZF],[rear,ZR]]){
      if(u.lane==b.l&&Math.abs(it.position.z-z)<u.half+.8){
        if(u.k=='o'){
          if(shield){shield=false;u.dead=true;scene.remove(it);shake=.3;flash=.4;beep(180,.3,'sawtooth',.15,-60);vib(80);pop(LX[u.lane],z,'護盾破裂','#4aa3ff');continue;}
          gameOver();return;}
        if(u.k=='u'){
          u.dead=true;scene.remove(it);beep(800,.15,'sine',.12,500);
          if(u.kind=='shield')shield=true;if(u.kind=='x2')dbl=10;if(u.kind=='slow')slow=6;
          pop(LX[u.lane],z,PU[u.kind].i,'#fff');continue;}
        u.dead=true;scene.remove(it);combo=Math.min(combo+1,10);kills++;shake=.15;flash=.3;
        const pts=Math.round(u.ty.m*10*(1+Math.floor(combo/3)*.5)*(dbl>0?2:1));score+=pts;
        pop(LX[u.lane],z,'+'+pts,u.ty.c);burst(LX[u.lane],z,0xff3333);splat(LX[u.lane],z);
        beep(90,.15,'square',.15,-40);vib(30);
        const ns=1+Math.floor(score/400);if(ns>stage){stage=ns;showStage();speed+=2;}
      }
    }
    if(!u.dead&&u.k=='p'&&it.position.z>ZR+4){u.dead=true;scene.remove(it);combo=0;}
  }
  items=items.filter(i=>!i.userData.dead&&i.position.z<ZR+20);
  for(const s of splats)s.position.z+=speed*dt;
  splats=splats.filter(s=>{if(s.position.z>15){scene.remove(s);return false}return true});
  for(const p of parts){p.t+=rdt;p.m.position.addScaledVector(p.v,rdt);if(!p.s)p.v.y-=20*rdt;p.m.position.y=Math.max(.1,p.m.position.y);}
  parts=parts.filter(p=>{if(p.t>(p.s?1:.9)){scene.remove(p.m);return false}return true});
  for(const p of pops){p.t+=rdt;p.m.position.y+=2*rdt;p.m.material.opacity=Math.max(0,1-p.t);}
  pops=pops.filter(p=>{if(p.t>1){scene.remove(p.m);return false}return true});
  $('sc').textContent='得分 '+score;$('sub').textContent='最高 '+best+'　輾過 '+kills+'　第'+stage+'關';
  $('cb').textContent=combo>1?'連擊 '+combo:'';
  $('stat').textContent=(shield?'🛡 ':'')+(dbl>0?'✨'+Math.ceil(dbl)+'s ':'')+(slow>0?'⏱'+Math.ceil(slow)+'s':'');
}
function render(){
  bF.position.set(front.x,0,ZF);bR.position.set(rear.x,0,ZR);
  const a=new THREE.Vector3(front.x,1.5,ZF),b=new THREE.Vector3(rear.x,1.5,ZR);
  body.position.copy(a).add(b).multiplyScalar(.5);
  body.scale.z=a.distanceTo(b);body.lookAt(a);
  shieldMesh.visible=shield;shieldMesh.position.copy(body.position);shieldMesh.scale.set(1,1,1+body.scale.z*.5);shieldMesh.lookAt(a);
  const off=dist%3;let i=0;
  for(let l=0;l<3;l++)for(let k=0;k<50;k++)sleepers[i++].position.set(LX[l],.05,-k*3+10+off);
  fires.forEach((f,i)=>{f.position.z=((-i*10+dist)%140)-120;f.scale.y=1+Math.sin(performance.now()/100+i)*.2;});
  const sh=shake>0?(Math.random()-.5)*.5:0;
  camera.position.set((front.x+rear.x)*.12+sh,(camera.aspect<.8?9.5:8)+sh,camera.aspect<.8?11:9);
  camera.lookAt((front.x+rear.x)*.3,0,-9);
  $('flash').style.opacity=Math.max(0,flash);
  renderer.render(scene,camera);
}
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  if(st=='play'&&!paused)update(dt);
  if(shake>0)shake-=dt;if(flash>0)flash-=dt;
  render();requestAnimationFrame(loop);
}
reset();$('best').textContent='最高分：'+best;
requestAnimationFrame(loop);
</script>
</body>
</html>
